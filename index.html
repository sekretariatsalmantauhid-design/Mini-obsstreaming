<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini OBS Web Studio - Light Edition</title>
    <link class="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f3f4f6">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom Scrollbar - Light Theme */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        #outputCanvas { touch-action: none; } 
        
        /* Tombol Scene - Light Theme */
        .scene-btn {
            background-color: #f3f4f6; color: #4b5563; padding: 0.75rem 1rem; border-radius: 0.375rem; font-weight: 600; transition: all 0.2s; border: 1px solid #d1d5db; border-left: 4px solid transparent; display: flex; align-items: center;
        }
        .scene-btn:hover { background-color: #e5e7eb; color: #1f2937; }
        .scene-btn.active { background-color: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; border-left: 4px solid #3b82f6; box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.05); }

        #loadingDB { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.95); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        /* =========================================
           DUAL UI ARCHITECTURE - LIGHT THEME OBS
           ========================================= */

        /* ---> MODE V15 (DASHBOARD REMOTE) <--- */
        body.mode-v15 { background-color: #e5e7eb; color: #1f2937; } /* Warna abu-abu klasik OBS */
        body.mode-v15 #appHeader { display: flex; background-color: #f3f4f6; border-bottom: 1px solid #d1d5db; }
        body.mode-v15 #mainLayout { display: flex; flex-direction: column; padding: 1rem; gap: 1rem; height: calc(100vh - 74px); max-width: 80rem; margin: 0 auto; }
        @media (min-width: 768px) { body.mode-v15 #mainLayout { flex-direction: row; } }
        
        body.mode-v15 #canvasWrapper { width: 100%; position: relative; border-radius: 0.5rem; overflow: hidden; border: 1px solid #9ca3af; background: #000; flex: 1; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        @media (min-width: 768px) { body.mode-v15 #canvasWrapper { width: 50%; flex: none; } }
        body.mode-v15 #canvasWrapper #outputCanvas { object-fit: contain; }
        
        body.mode-v15 #panelWrapper { width: 100%; flex: 1; overflow-y: auto; padding-right: 0.5rem; }
        @media (min-width: 768px) { body.mode-v15 #panelWrapper { width: 50%; flex: none; } }
        body.mode-v15 #panelContainer { display: flex; flex-direction: column; gap: 1.5rem; width: 100%; transform: none !important; position: relative; background: transparent; }
        
        /* Panel Putih Klasik */
        body.mode-v15 .panel-card { background-color: #ffffff; padding: 1.25rem; border-radius: 0.5rem; border: 1px solid #d1d5db; box-shadow: 0 1px 3px 0 rgba(0,0,0,0.1); }
        body.mode-v15 #btnToggleMenu, body.mode-v15 #panelHeaderTitle { display: none !important; }

        /* ---> MODE V16 (FULLSCREEN KAMERA) <--- */
        /* Biarkan V16 tetap gelap agar tidak menyilaukan saat dipakai sebagai kamera lapangan */
        body.mode-v16 { background-color: #000; color: #f3f4f6; }
        body.mode-v16 #appHeader { display: none; }
        body.mode-v16 #mainLayout { display: block; width: 100vw; height: 100vh; padding: 0; margin: 0; overflow: hidden; position: relative; }
        body.mode-v16 #canvasWrapper { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; border: none; border-radius: 0; }
        body.mode-v16 #canvasWrapper #outputCanvas { object-fit: cover; }
        body.mode-v16 #panelWrapper { position: absolute; inset: 0; z-index: 40; pointer-events: none; display: flex; justify-content: flex-end; overflow: hidden; padding: 0; }
        body.mode-v16 #panelContainer { width: 400px; max-width: 100%; height: 100%; background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-left: 1px solid #d1d5db; pointer-events: auto; display: flex; flex-direction: column; gap: 0; transform: translateX(100%); transition: transform 0.3s ease; color: #1f2937; }
        body.mode-v16 #panelContainer.open { transform: translateX(0); }
        body.mode-v16 .panel-content-scroll { overflow-y: auto; flex-grow: 1; padding: 1.25rem; display: flex; flex-direction: column; gap: 1.5rem; }
        body.mode-v16 .panel-card { padding: 0; border: none; background: transparent; box-shadow: none; border-bottom: 1px solid #d1d5db; padding-bottom: 1.5rem; border-radius: 0; }
        body.mode-v16 #btnToggleMenu { display: flex; position: absolute; top: 1rem; right: 1rem; z-index: 50; }
        body.mode-v16 #panelHeaderTitle { display: flex; justify-content: space-between; align-items: center; padding: 1rem; background: rgba(243, 244, 246, 0.9); border-bottom: 1px solid #d1d5db; flex-shrink: 0; }

        /* VU Meter */
        .vu-meter-container { height: 6px; width: 100%; background-color: #d1d5db; border-radius: 3px; overflow: hidden; margin-top: 5px; }
        .vu-meter-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #4ade80 0%, #facc15 70%, #ef4444 100%); transition: width 0.05s ease-out; }
        
        /* Filter Efek Kamera */
        .filter-warm { filter: sepia(0.3) saturate(1.2) hue-rotate(-10deg); }
        .filter-bw { filter: grayscale(1); }
        .filter-vivid { filter: saturate(1.5) contrast(1.1); }

        /* Disable Switch Toggle Custom */
        .toggle-checkbox:checked { right: 0; border-color: #3b82f6; }
        .toggle-checkbox:checked + .toggle-label { background-color: #3b82f6; }
    </style>
</head>

<body id="body" class="mode-v15 font-sans antialiased h-[100dvh] w-screen overflow-hidden relative">

    <div id="loadingDB">
        <i class="fa-solid fa-circle-notch fa-spin text-4xl text-blue-600 mb-4"></i>
        <p class="text-gray-700 font-semibold animate-pulse">Memuat Gudang Penyimpanan...</p>
    </div>

    <header id="appHeader" class="p-4 shadow-sm justify-between items-center w-full z-10 flex-shrink-0">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-bold text-gray-800"><i class="fa-solid fa-satellite-dish text-blue-600 mr-2"></i>Mini OBS - Panel</h1>
            <div id="statusBadgeV15" class="px-3 py-1 bg-white text-xs rounded-full font-semibold text-gray-600 border border-gray-300 shadow-sm">
                <i class="fa-solid fa-circle text-gray-400 mr-1 text-[10px]"></i> Standby
            </div>
        </div>
        <button onclick="switchMode('v16')" class="bg-gray-100 hover:bg-gray-200 text-gray-800 px-4 py-2 rounded font-bold transition shadow-sm text-sm border border-gray-300 flex items-center">
            <i class="fa-solid fa-mobile-screen mr-2 text-blue-600"></i> Mode Layar Penuh
        </button>
    </header>

    <div id="mainLayout">
        
        <div id="canvasWrapper" class="group">
            <video id="videoSource" playsinline muted class="hidden"></video>
            <video id="muqoddimahVideoSource" playsinline class="hidden"></video>
            <video id="introVideoSource" playsinline class="hidden"></video>
            <video id="pauseVideoSource" playsinline class="hidden"></video>
            <video id="outroVideoSource" playsinline class="hidden"></video>
            
            <canvas id="outputCanvas" class="w-full h-full object-contain bg-black cursor-move"></canvas>
            
            <div id="camOffPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none hidden bg-black/80">
                <i class="fa-solid fa-camera-slash text-6xl text-gray-400 mb-4"></i>
                <p class="text-gray-300 font-semibold" id="camPlaceholderText">Kamera Belum Aktif</p>
            </div>

            <button id="btnFullscreen" class="absolute top-2 left-2 bg-white bg-opacity-70 hover:bg-opacity-100 text-gray-800 w-10 h-10 rounded transition shadow opacity-50 group-hover:opacity-100 z-50 flex items-center justify-center border border-gray-300">
                <i class="fa-solid fa-expand" id="fullscreenIcon"></i>
            </button>

            <button id="btnToggleMenu" class="bg-blue-600/90 hover:bg-blue-700 backdrop-blur-md text-white w-12 h-12 rounded-full shadow-lg transition border border-blue-500 flex justify-center items-center">
                <i class="fa-solid fa-gear text-xl"></i>
            </button>
            <button id="btnSwitchModeV16" onclick="switchMode('v15')" class="absolute top-4 left-4 z-50 bg-white/90 hover:bg-gray-100 backdrop-blur-md text-gray-800 px-4 py-2 rounded-full shadow-lg transition border border-gray-300 font-bold text-xs" style="display: none;">
                <i class="fa-solid fa-arrow-left mr-2 text-blue-600"></i>Kembali ke Panel
            </button>
            <div id="statusBadgeV16" class="absolute bottom-10 left-4 z-50 px-4 py-2 bg-white/90 backdrop-blur-md text-xs rounded-full font-bold text-gray-800 border border-gray-300 shadow-lg pointer-events-none" style="display: none;">
                <i class="fa-solid fa-circle text-gray-400 mr-2 text-[10px]"></i>Standby
            </div>

            <div id="vuMeterWrapper" class="absolute bottom-2 left-2 right-2 hidden z-50 opacity-90">
                <div class="vu-meter-container shadow-sm border border-gray-400">
                    <div id="vuMeterBar" class="vu-meter-bar"></div>
                </div>
            </div>
        </div>

        <div id="panelWrapper" class="custom-scrollbar">
            
            <div id="panelContainer">
                
                <div id="panelHeaderTitle">
                    <h1 class="text-lg font-bold text-gray-800"><i class="fa-solid fa-sliders text-blue-600 mr-2"></i>Control Room</h1>
                    <button id="btnCloseMenu" class="text-gray-500 hover:text-gray-800 bg-gray-200 hover:bg-gray-300 rounded-full w-8 h-8 flex items-center justify-center transition border border-gray-300">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>

                <div class="panel-content-scroll custom-scrollbar">
                    
                    <div class="panel-card">
                        <h2 class="text-lg font-semibold mb-3 border-b border-gray-200 pb-2 text-gray-800"><i class="fa-solid fa-layer-group mr-2 text-gray-500"></i>Adegan (Scenes)</h2>
                        <div class="flex flex-col gap-2">
                            <button onclick="changeScene('muqoddimah')" id="btnSceneMuqoddimah" class="scene-btn w-full"><i class="fa-solid fa-book-open w-6 text-center mr-2"></i>Muqoddimah</button>
                            <button onclick="changeScene('intro')" id="btnSceneIntro" class="scene-btn w-full"><i class="fa-solid fa-hourglass-start w-6 text-center mr-2"></i>Intro</button>
                            <button onclick="changeScene('live')" id="btnSceneLive" class="scene-btn active w-full"><i class="fa-solid fa-camera w-6 text-center mr-2"></i>Live Camera</button>
                            <button onclick="changeScene('pause')" id="btnScenePause" class="scene-btn w-full"><i class="fa-solid fa-pause w-6 text-center mr-2"></i>Pause</button>
                            <button onclick="changeScene('outro')" id="btnSceneOutro" class="scene-btn w-full"><i class="fa-solid fa-flag-checkered w-6 text-center mr-2"></i>Outro</button>
                        </div>
                    </div>

                    <div class="panel-card">
                        <h2 class="text-lg font-semibold mb-4 border-b border-gray-200 pb-2 text-gray-800"><i class="fa-solid fa-sliders mr-2 text-gray-500"></i>Pengaturan Sistem</h2>
                        
                        <div class="mb-4 bg-gray-50 p-3 rounded border border-gray-200">
                            
                            <label class="block text-xs font-bold text-gray-700 mb-2"><i class="fa-solid fa-display mr-1 text-gray-500"></i> Resolusi Kamera</label>
                            <select id="resolutionSelect" class="w-full bg-white border border-gray-300 text-gray-900 rounded text-sm py-2 px-3 focus:outline-none focus:border-blue-500 font-semibold cursor-pointer mb-3 shadow-sm">
                                <option value="480">SD (854x480) - Super Ringan</option>
                                <option value="720" selected>HD (1280x720) - Standar Mulus</option>
                                <option value="1080">Full HD (1920x1080) - Kualitas Tinggi</option>
                            </select>

                            <label class="block text-xs font-bold text-gray-700 mb-2 mt-3"><i class="fa-solid fa-microphone mr-1 text-gray-500"></i> Pilih Mikrofon Input</label>
                            <select id="audioInputSelect" class="w-full bg-white border border-gray-300 text-gray-900 rounded text-sm py-2 px-3 focus:outline-none focus:border-blue-500 font-semibold cursor-pointer mb-3 shadow-sm">
                                <option value="default">Default (Bawaan HP)</option>
                            </select>
                            
                            <label class="block text-xs font-bold text-gray-700 mb-2 mt-3"><i class="fa-solid fa-wave-square mr-1 text-gray-500"></i> Kualitas Audio</label>
                            <select id="audioSampleRate" class="w-full bg-white border border-gray-300 text-gray-900 rounded text-sm py-2 px-3 focus:outline-none focus:border-blue-500 font-semibold cursor-pointer mb-3 shadow-sm">
                                <option value="44100" selected>44100 Hz (Standar - Ringan)</option>
                                <option value="48000">48000 Hz (Berat - Kualitas Studio)</option>
                                <option value="22050">22050 Hz (Sangat Ringan - Anti Kresek)</option>
                            </select>

                            <div class="border-t border-gray-200 pt-3 mt-3">
                                <label class="block text-xs font-bold text-gray-700 mb-2"><i class="fa-solid fa-wand-magic-sparkles mr-1 text-gray-500"></i> Filter Kamera</label>
                                <select id="filterSelect" class="w-full bg-white border border-gray-300 text-gray-900 rounded text-sm py-2 px-3 focus:outline-none focus:border-blue-500 cursor-pointer shadow-sm">
                                    <option value="none">Normal (Asli)</option>
                                    <option value="filter-warm">Hangat (Warm/Cinematic)</option>
                                    <option value="filter-bw">Hitam Putih (BW)</option>
                                    <option value="filter-vivid">Vivid (Warna Tajam)</option>
                                </select>
                            </div>

                            <div class="border-t border-gray-200 pt-3 mt-3">
                                <label class="flex justify-between text-xs font-bold text-gray-700 mb-2">
                                    <span><i class="fa-solid fa-magnifying-glass mr-1 text-gray-500"></i> Zoom Kamera</span>
                                    <span id="lblCamZoom" class="text-blue-600">1.0x</span>
                                </label>
                                <div class="flex items-center gap-3 mb-4">
                                    <i class="fa-solid fa-minus text-gray-400 text-xs cursor-pointer hover:text-gray-800" onclick="document.getElementById('camZoomInput').stepDown(); document.getElementById('camZoomInput').dispatchEvent(new Event('input'))"></i>
                                    <input type="range" id="camZoomInput" min="1.0" max="5.0" step="0.1" value="1.0" class="w-full accent-blue-600 h-2 bg-gray-300 rounded-lg appearance-none cursor-pointer">
                                    <i class="fa-solid fa-plus text-gray-400 text-xs cursor-pointer hover:text-gray-800" onclick="document.getElementById('camZoomInput').stepUp(); document.getElementById('camZoomInput').dispatchEvent(new Event('input'))"></i>
                                </div>

                                <div id="focusControlContainer" style="display: none;">
                                    <div class="flex justify-between items-center mb-2">
                                        <label class="text-xs font-bold text-gray-700"><i class="fa-solid fa-crosshairs mr-1 text-gray-500"></i> Mode Fokus</label>
                                        <div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                                            <input type="checkbox" name="toggle" id="focusModeToggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer border-gray-300"/>
                                            <label for="focusModeToggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                                        </div>
                                    </div>
                                    <div class="flex justify-between text-[10px] text-gray-500 mb-2 px-1 font-semibold">
                                        <span>Manual Kunci (M)</span>
                                        <span>Otomatis (A)</span>
                                    </div>
                                    
                                    <div id="manualFocusSlider" style="display: none;" class="mt-2">
                                        <label class="flex justify-between text-xs font-bold text-blue-600 mb-2">
                                            <span>Geser untuk Kunci Fokus</span>
                                        </label>
                                        <div class="flex items-center gap-3 mb-2">
                                            <i class="fa-solid fa-mountain text-gray-400 text-xs"></i>
                                            <input type="range" id="camFocusInput" min="0" max="2" step="0.01" value="0.15" class="w-full accent-blue-600 h-2 bg-gray-300 rounded-lg appearance-none cursor-pointer">
                                            <i class="fa-solid fa-user text-gray-400 text-xs"></i>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <label class="block text-xs font-bold text-gray-700 mb-2 mt-4"><i class="fa-solid fa-key mr-1 text-gray-500"></i> RTMP URL (Wajib rtmps://)</label>
                            <input type="text" id="rtmpInput" placeholder="rtmps://a.rtmp.youtube.com:443/live2/xxxx" class="w-full text-xs bg-white border border-gray-300 rounded px-3 py-3 focus:outline-none focus:border-blue-500 text-gray-900 font-mono shadow-sm">
                        </div>

                        <div class="flex gap-3 mb-4">
                            <button id="btnStartCam" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-3 rounded font-semibold transition shadow-sm"><i class="fa-solid fa-camera mr-2"></i>Nyala Kamera</button>
                            <button id="btnStopCam" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white py-3 rounded font-semibold transition shadow-sm hidden"><i class="fa-solid fa-stop mr-2"></i>Mati Kamera</button>
                        </div>
                        
                        <div class="flex gap-2 mb-4">
                            <button id="btnRecord" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 py-3 rounded font-bold transition shadow-sm border border-gray-300 text-sm">
                                <i class="fa-solid fa-record-vinyl mr-1 text-red-500"></i>Rekam
                            </button>
                            <button id="btnStopRecord" class="flex-1 bg-red-100 hover:bg-red-200 text-red-700 py-3 rounded font-bold transition shadow-sm border border-red-300 hidden text-sm">
                                <i class="fa-solid fa-square mr-1"></i>Stop Rekam
                            </button>
                            
                            <button id="btnStream" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded font-bold transition shadow-sm text-sm border border-blue-700">
                                <i class="fa-solid fa-broadcast-tower mr-1"></i>GO LIVE
                            </button>
                            <button id="btnStopStream" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-3 rounded font-bold transition shadow-sm hidden text-sm">
                                <i class="fa-solid fa-square mr-1"></i>Stop LIVE
                            </button>
                        </div>
                    </div>

                    <div class="panel-card flex flex-col">
                        <div class="flex justify-between items-center mb-4 border-b border-gray-200 pb-2">
                            <h2 class="text-lg font-semibold text-gray-800"><i class="fa-solid fa-images mr-2 text-gray-500"></i>Overlay & Sumber</h2>
                            <button id="btnClearOverlays" class="text-xs bg-red-100 border border-red-300 text-red-700 px-3 py-1.5 rounded hover:bg-red-200 transition font-semibold">Hapus Semua</button>
                        </div>
                        
                        <div class="mb-4">
                            <label class="block text-xs font-bold text-gray-700 mb-1">Tambah Gambar Logo</label>
                            <input type="file" id="overlayInput" accept="image/png, image/jpeg, image/gif" class="block w-full text-sm text-gray-600 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:font-semibold file:bg-gray-200 file:text-gray-800 hover:file:bg-gray-300 bg-white border border-gray-300 rounded cursor-pointer shadow-sm">
                        </div>

                        <div class="mb-4 border-t border-gray-200 pt-4">
                            <label class="block text-xs font-bold text-gray-700 mb-1">Tambah Teks Kajian</label>
                            <div class="flex flex-col gap-3">
                                <input type="text" id="textInput" placeholder="Ketik teks kajian..." class="w-full text-sm bg-white border border-gray-300 rounded px-3 py-3 focus:outline-none focus:border-blue-500 text-gray-900 shadow-sm">
                                <div class="flex gap-2 items-center">
                                    <select id="fontSelect" class="flex-1 text-sm bg-white border border-gray-300 rounded px-3 py-3 focus:outline-none focus:border-blue-500 text-gray-900 cursor-pointer shadow-sm">
                                        <option value="sans-serif">Sans-Serif</option>
                                        <option value="serif">Serif (Formal)</option>
                                        <option value="monospace">Monospace</option>
                                    </select>
                                    <input type="color" id="textColor" value="#ffffff" class="w-12 h-11 rounded cursor-pointer border border-gray-300 bg-white p-1 shadow-sm">
                                    <button id="btnAddText" class="bg-gray-200 hover:bg-gray-300 border border-gray-300 text-gray-800 px-5 py-3 rounded text-sm font-bold transition shadow-sm">Tambah</button>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4 border-t border-gray-200 pt-4">
                            <label class="block text-xs font-bold text-gray-700 mb-2">Timer Kajian (Countup)</label>
                            <div class="flex flex-wrap gap-2 items-center">
                                <button id="btnToggleTimer" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-semibold transition flex-1 sm:flex-none shadow-sm"><i class="fa-solid fa-play mr-1"></i> Mulai Timer</button>
                                <button id="btnResetTimer" class="bg-gray-200 border border-gray-300 hover:bg-gray-300 text-gray-800 px-3 py-2 rounded text-sm font-semibold transition shadow-sm"><i class="fa-solid fa-rotate-left"></i></button>
                                <input type="color" id="timerColor" value="#ffffff" class="w-10 h-9 rounded cursor-pointer border border-gray-300 bg-white p-1 ml-auto shadow-sm">
                            </div>
                            <div class="mt-3">
                                <label class="flex justify-between text-xs font-bold text-gray-700 mb-1"><span>Transparansi Timer</span><span id="lblTimerAlpha" class="text-blue-600 font-bold">100%</span></label>
                                <div class="flex items-center gap-3"><i class="fa-regular fa-eye-slash text-gray-400 text-xs"></i><input type="range" id="timerAlphaInput" min="0.1" max="1.0" step="0.1" value="1.0" class="w-full accent-blue-600 h-2 bg-gray-300 rounded-lg appearance-none cursor-pointer"><i class="fa-regular fa-eye text-gray-400 text-xs"></i></div>
                            </div>
                        </div>

                        <div class="bg-gray-50 rounded border border-gray-200 p-3 overflow-y-auto max-h-64 min-h-[150px] custom-scrollbar" id="overlayList">
                            <p class="text-sm text-gray-500 text-center mt-4" id="emptyOverlayMsg">Belum ada sumber ditambahkan.</p>
                        </div>
                    </div>

                    <div class="panel-card">
                        <h2 class="text-lg font-semibold mb-4 border-b border-gray-200 pb-2 text-gray-800"><i class="fa-solid fa-film mr-2 text-gray-500"></i>Media MP4</h2>
                        <div id="mediaInputsContainer" class="space-y-4"></div>
                    </div>

                    <div class="panel-card pb-10">
                        <h2 class="text-lg font-semibold mb-4 border-b border-gray-200 pb-2 text-gray-800"><i class="fa-solid fa-wand-magic-sparkles mr-2 text-gray-500"></i>Transisi Adegan</h2>
                        <div class="mb-5">
                            <label class="flex justify-between text-sm font-bold text-gray-700 mb-2"><span>Pindah Scene (Fade)</span><span id="lblSceneSpeed" class="text-blue-600 font-bold">Normal</span></label>

        btnStopRecord.addEventListener('click', () => { if (mediaRecorder && isRecording) { mediaRecorder.stop(); isRecording = false; btnRecord.classList.remove('hidden'); btnStream.classList.remove('hidden'); btnStopRecord.classList.add('hidden'); updateStatus(stream ? `Kamera Aktif (${currentCamWidth}x${currentCamHeight})` : 'Standby', stream ? 'text-green-600' : 'text-gray-400', stream ? 'fa-video' : 'fa-circle'); } });
        function saveRecording() { const blob = new Blob(recordedChunks, { type: 'video/webm' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.style = 'display: none'; a.href = url; a.download = `Kajian_Pro_${currentCamHeight}p_${new Date().getTime()}.webm`; document.body.appendChild(a); a.click(); setTimeout(() => { window.URL.revokeObjectURL(url); document.body.removeChild(a); }, 100); }

        function formatTime(totalSeconds) { const h = Math.floor(totalSeconds / 3600).toString().padStart(2, '0'); const m = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0'); const s = (totalSeconds % 60).toString().padStart(2, '0'); return `${h}:${m}:${s}`; }
        btnToggleTimer.addEventListener('click', () => {
            timerActive = !timerActive;
            if (timerActive) { lastTimerUpdate = Date.now(); btnToggleTimer.innerHTML = '<i class="fa-solid fa-pause mr-1"></i> Pause Timer'; btnToggleTimer.classList.replace('bg-blue-600', 'bg-yellow-600'); btnToggleTimer.classList.replace('hover:bg-blue-700', 'hover:bg-yellow-700'); } 
            else { btnToggleTimer.innerHTML = '<i class="fa-solid fa-play mr-1"></i> Mulai Timer'; btnToggleTimer.classList.replace('bg-yellow-600', 'bg-blue-600'); btnToggleTimer.classList.replace('hover:bg-yellow-700', 'hover:bg-blue-700'); }
        });
        btnResetTimer.addEventListener('click', () => { timerSeconds = 0; if (!timerActive) drawFrame(); });

        let wakeLock = null;
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Mantra Anti-Tidur Aktif!');
                    
                    wakeLock.addEventListener('release', () => {
                        console.log('Mantra terlepas, bersiap mengunci lagi...');
                    });
                }
            } catch (err) {
                console.error('Gagal mengunci layar:', err);
            }
        }
        window.addEventListener('load', requestWakeLock);
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                requestWakeLock();
            }
        });

        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(err => {}); }); }
    </script>
</body>
