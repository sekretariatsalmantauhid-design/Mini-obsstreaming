<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini OBS Web Studio - Ultimate Edition</title>
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        
        #outputCanvas { touch-action: none; } 
        
        .scene-btn {
            background-color: #374151; color: #d1d5db; padding: 0.75rem 1rem; border-radius: 0.375rem; font-weight: 600; transition: all 0.2s; border-left: 4px solid transparent; display: flex; align-items: center;
        }
        .scene-btn:hover { background-color: #4b5563; }
        .scene-btn.active { background-color: #2563eb; color: #ffffff; border-left: 4px solid #93c5fd; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }

        #loadingDB { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        /* =========================================
           DUAL UI ARCHITECTURE (CSS SAKTI)
           ========================================= */

        /* ---> MODE V15 (DASHBOARD REMOTE) <--- */
        body.mode-v15 { background-color: #111827; }
        body.mode-v15 #appHeader { display: flex; }
        body.mode-v15 #mainLayout { display: flex; flex-direction: column; padding: 1rem; gap: 1rem; height: calc(100vh - 74px); max-width: 80rem; margin: 0 auto; }
        @media (min-width: 768px) { body.mode-v15 #mainLayout { flex-direction: row; } }
        body.mode-v15 #canvasWrapper { width: 100%; position: relative; border-radius: 0.5rem; overflow: hidden; border: 1px solid #374151; background: #000; flex: 1; }
        @media (min-width: 768px) { body.mode-v15 #canvasWrapper { width: 50%; flex: none; } }
        body.mode-v15 #canvasWrapper #outputCanvas { object-fit: contain; }
        body.mode-v15 #panelWrapper { width: 100%; flex: 1; overflow-y: auto; padding-right: 0.5rem; }
        @media (min-width: 768px) { body.mode-v15 #panelWrapper { width: 50%; flex: none; } }
        body.mode-v15 #panelContainer { display: flex; flex-direction: column; gap: 1.5rem; width: 100%; transform: none !important; position: relative; background: transparent; }
        body.mode-v15 .panel-card { background-color: #1f2937; padding: 1.25rem; border-radius: 0.5rem; border: 1px solid #374151; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        body.mode-v15 #btnToggleMenu, body.mode-v15 #panelHeaderTitle { display: none !important; }

        /* ---> MODE V16 (FULLSCREEN KAMERA) <--- */
        body.mode-v16 { background-color: #000; }
        body.mode-v16 #appHeader { display: none; }
        body.mode-v16 #mainLayout { display: block; width: 100vw; height: 100vh; padding: 0; margin: 0; overflow: hidden; position: relative; }
        body.mode-v16 #canvasWrapper { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; border: none; border-radius: 0; }
        body.mode-v16 #canvasWrapper #outputCanvas { object-fit: cover; }
        body.mode-v16 #panelWrapper { position: absolute; inset: 0; z-index: 40; pointer-events: none; display: flex; justify-content: flex-end; overflow: hidden; padding: 0; }
        body.mode-v16 #panelContainer { width: 400px; max-width: 100%; height: 100%; background-color: rgba(17, 24, 39, 0.9); backdrop-filter: blur(10px); border-left: 1px solid #374151; pointer-events: auto; display: flex; flex-direction: column; gap: 0; transform: translateX(100%); transition: transform 0.3s ease; }
        body.mode-v16 #panelContainer.open { transform: translateX(0); }
        body.mode-v16 .panel-content-scroll { overflow-y: auto; flex-grow: 1; padding: 1.25rem; display: flex; flex-direction: column; gap: 1.5rem; }
        body.mode-v16 .panel-card { padding: 0; border: none; background: transparent; box-shadow: none; border-bottom: 1px solid #374151; padding-bottom: 1.5rem; border-radius: 0; }
        body.mode-v16 #btnToggleMenu { display: flex; position: absolute; top: 1rem; right: 1rem; z-index: 50; }
        body.mode-v16 #panelHeaderTitle { display: flex; justify-content: space-between; align-items: center; padding: 1rem; background: rgba(17, 24, 39, 0.5); border-bottom: 1px solid #374151; flex-shrink: 0; }

        /* VU Meter */
        .vu-meter-container { height: 6px; width: 100%; background-color: #374151; border-radius: 3px; overflow: hidden; margin-top: 5px; }
        .vu-meter-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #4ade80 0%, #facc15 70%, #ef4444 100%); transition: width 0.05s ease-out; }
    </style>
</head>

<body id="body" class="mode-v15 text-gray-100 font-sans antialiased h-[100dvh] w-screen overflow-hidden relative">

    <div id="loadingDB">
        <i class="fa-solid fa-circle-notch fa-spin text-4xl text-blue-500 mb-4"></i>
        <p class="text-white font-semibold animate-pulse">Memuat Gudang Penyimpanan...</p>
    </div>

    <header id="appHeader" class="bg-gray-800 border-b border-gray-700 p-4 shadow-md justify-between items-center w-full z-10 flex-shrink-0">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-bold text-blue-400"><i class="fa-solid fa-satellite-dish text-red-500 mr-2"></i>Mode Remote (V15)</h1>
            <div id="statusBadgeV15" class="px-3 py-1 bg-gray-700 text-xs rounded-full font-semibold text-gray-300 border border-gray-600">
                <i class="fa-solid fa-circle text-gray-500 mr-1 text-[10px]"></i> Standby
            </div>
        </div>
        <button onclick="switchMode('v16')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded font-bold transition shadow text-sm border border-indigo-500 flex items-center">
            <i class="fa-solid fa-mobile-screen mr-2"></i> Ganti Mode Kamera
        </button>
    </header>

    <div id="mainLayout">
        
        <div id="canvasWrapper" class="group">
            <video id="videoSource" playsinline muted class="hidden"></video>
            <video id="muqoddimahVideoSource" playsinline class="hidden"></video>
            <video id="introVideoSource" playsinline class="hidden"></video>
            <video id="pauseVideoSource" playsinline class="hidden"></video>
            <video id="outroVideoSource" playsinline class="hidden"></video>
            
            <canvas id="outputCanvas" class="w-full h-full object-contain bg-black cursor-move"></canvas>
            
            <div id="camOffPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none hidden bg-black/80">
                <i class="fa-solid fa-camera-slash text-6xl text-gray-700 mb-4"></i>
                <p class="text-gray-500 font-semibold" id="camPlaceholderText">Kamera Belum Aktif</p>
            </div>

            <button id="btnFullscreen" class="absolute top-2 left-2 bg-gray-800 bg-opacity-70 hover:bg-opacity-100 text-white w-10 h-10 rounded transition opacity-50 group-hover:opacity-100 z-50 flex items-center justify-center">
                <i class="fa-solid fa-expand" id="fullscreenIcon"></i>
            </button>

            <button id="btnToggleMenu" class="bg-blue-600/80 hover:bg-blue-700 backdrop-blur-md text-white w-12 h-12 rounded-full shadow-lg transition border border-blue-500 flex justify-center items-center">
                <i class="fa-solid fa-gear text-xl"></i>
            </button>
            <button id="btnSwitchModeV16" onclick="switchMode('v15')" class="absolute top-4 left-4 z-50 bg-gray-900/80 hover:bg-gray-800 backdrop-blur-md text-white px-4 py-2 rounded-full shadow-lg transition border border-gray-600 font-bold text-xs" style="display: none;">
                <i class="fa-solid fa-arrow-left mr-2 text-blue-400"></i>Mode Remote
            </button>
            <div id="statusBadgeV16" class="absolute bottom-10 left-4 z-50 px-4 py-2 bg-gray-900/80 backdrop-blur-md text-xs rounded-full font-bold text-gray-200 border border-gray-600 shadow-lg pointer-events-none" style="display: none;">
                <i class="fa-solid fa-circle text-gray-500 mr-2 text-[10px]"></i>Standby
            </div>

            <div id="vuMeterWrapper" class="absolute bottom-2 left-2 right-2 hidden z-50 opacity-75">
                <div class="vu-meter-container">
                    <div id="vuMeterBar" class="vu-meter-bar"></div>
                </div>
            </div>
        </div>

        <div id="panelWrapper" class="custom-scrollbar">
            
            <div id="panelContainer">
                
                <div id="panelHeaderTitle">
                    <h1 class="text-lg font-bold text-blue-400"><i class="fa-solid fa-sliders text-gray-400 mr-2"></i>Control Room</h1>
                    <button id="btnCloseMenu" class="text-gray-400 hover:text-white bg-gray-800/80 hover:bg-gray-700 rounded-full w-8 h-8 flex items-center justify-center transition border border-gray-600">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>

                <div class="panel-content-scroll custom-scrollbar">
                    
                    <div class="panel-card">
                        <h2 class="text-lg font-semibold mb-3 border-b border-gray-600 pb-2"><i class="fa-solid fa-layer-group mr-2"></i>Pilih Scene</h2>
                        <div class="flex flex-col gap-2">
                            <button onclick="changeScene('muqoddimah')" id="btnSceneMuqoddimah" class="scene-btn w-full"><i class="fa-solid fa-book-open w-6 text-center mr-2"></i>Muqoddimah</button>
                            <button onclick="changeScene('intro')" id="btnSceneIntro" class="scene-btn w-full"><i class="fa-solid fa-hourglass-start w-6 text-center mr-2"></i>Intro</button>
                            <button onclick="changeScene('live')" id="btnSceneLive" class="scene-btn active w-full"><i class="fa-solid fa-camera w-6 text-center mr-2"></i>Live Camera</button>
                            <button onclick="changeScene('pause')" id="btnScenePause" class="scene-btn w-full"><i class="fa-solid fa-pause w-6 text-center mr-2"></i>Pause</button>
                            <button onclick="changeScene('outro')" id="btnSceneOutro" class="scene-btn w-full"><i class="fa-solid fa-flag-checkered w-6 text-center mr-2"></i>Outro</button>
                        </div>
                    </div>

                    <div class="panel-card">
                        <h2 class="text-lg font-semibold mb-4 border-b border-gray-600 pb-2"><i class="fa-solid fa-sliders mr-2"></i>Sistem & Streaming</h2>
                        
                        <div class="mb-4 bg-gray-900 p-3 rounded border border-gray-700">
                            
                            <label class="block text-xs font-bold text-gray-400 mb-2"><i class="fa-solid fa-display mr-1"></i> Resolusi Kamera</label>
                            <select id="resolutionSelect" class="w-full bg-gray-800 border border-gray-600 text-white rounded text-sm py-2 px-3 focus:outline-none focus:border-blue-500 font-semibold cursor-pointer mb-3">
                                <option value="480">SD (854x480) - Super Ringan</option>
                                <option value="720" selected>HD (1280x720) - Standar Mulus</option>
                                <option value="1080">Full HD (1920x1080) - Kualitas Tinggi</option>
                            </select>

                            <label class="block text-xs font-bold text-gray-400 mb-2 mt-3"><i class="fa-solid fa-microphone mr-1"></i> Pilih Mikrofon (Wajib Izinkan Audio)</label>
                            <select id="audioInputSelect" class="w-full bg-gray-800 border border-gray-600 text-white rounded text-sm py-2 px-3 focus:outline-none focus:border-blue-500 font-semibold cursor-pointer mb-3">
                                <option value="default">Default (Bawaan HP)</option>
                            </select>

                            <label class="flex justify-between text-xs font-bold text-gray-400 mb-2">
                                <span><i class="fa-solid fa-magnifying-glass mr-1"></i> Zoom Kamera</span>
                                <span id="lblCamZoom" class="text-blue-400">1.0x</span>
                            </label>
                            <div class="flex items-center gap-3 mb-4">
                                <i class="fa-solid fa-minus text-gray-500 text-xs cursor-pointer hover:text-white" onclick="document.getElementById('camZoomInput').stepDown(); document.getElementById('camZoomInput').dispatchEvent(new Event('input'))"></i>
                                <input type="range" id="camZoomInput" min="1.0" max="5.0" step="0.1" value="1.0" class="w-full accent-blue-500 h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
                                <i class="fa-solid fa-plus text-gray-500 text-xs cursor-pointer hover:text-white" onclick="document.getElementById('camZoomInput').stepUp(); document.getElementById('camZoomInput').dispatchEvent(new Event('input'))"></i>
                            </div>

                            <label class="block text-xs font-bold text-gray-400 mb-2"><i class="fa-solid fa-key mr-1"></i> RTMP URL (Wajib rtmps://)</label>
                            <input type="text" id="rtmpInput" placeholder="rtmps://a.rtmp.youtube.com:443/live2/xxxx" class="w-full text-xs bg-gray-800 border border-gray-600 rounded px-3 py-3 focus:outline-none focus:border-blue-500 text-white font-mono">
                        </div>

                        <div class="flex gap-3 mb-4">
                            <button id="btnStartCam" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-3 rounded font-semibold transition shadow"><i class="fa-solid fa-camera mr-2"></i>Nyala Kamera</button>
                            <button id="btnStopCam" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white py-3 rounded font-semibold transition shadow hidden"><i class="fa-solid fa-stop mr-2"></i>Mati Kamera</button>
                        </div>
                        
                        <div class="flex gap-2 mb-4">
                            <button id="btnRecord" class="flex-1 bg-gray-700 hover:bg-gray-600 text-white py-3 rounded font-bold transition shadow text-sm border border-gray-600">
                                <i class="fa-solid fa-record-vinyl mr-1 text-red-400"></i>Rekam
                            </button>
                            <button id="btnStopRecord" class="flex-1 bg-red-800 hover:bg-red-700 text-white py-3 rounded font-bold transition shadow hidden text-sm">
                                <i class="fa-solid fa-square mr-1"></i>Stop Rekam
                            </button>
                            
                            <button id="btnStream" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded font-bold transition shadow text-sm border border-blue-500">
                                <i class="fa-solid fa-broadcast-tower mr-1"></i>GO LIVE
                            </button>
                            <button id="btnStopStream" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-3 rounded font-bold transition shadow hidden text-sm">
                                <i class="fa-solid fa-square mr-1"></i>Stop LIVE
                            </button>
                        </div>
                    </div>

                    <div class="panel-card flex flex-col">
                        <div class="flex justify-between items-center mb-4 border-b border-gray-600 pb-2">
                            <h2 class="text-lg font-semibold"><i class="fa-solid fa-images mr-2"></i>Overlay & Teks</h2>
                            <button id="btnClearOverlays" class="text-xs bg-red-900 text-red-300 px-3 py-1.5 rounded hover:bg-red-800 transition font-semibold">Hapus Semua</button>
                        </div>
                        
                        <div class="mb-4">
                            <label class="block text-xs font-medium text-gray-400 mb-1">Tambah Gambar Logo</label>
                            <input type="file" id="overlayInput" accept="image/png, image/jpeg, image/gif" class="block w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 bg-gray-900 border border-gray-600 rounded cursor-pointer">
                        </div>

                        <div class="mb-4 border-t border-gray-700 pt-4">
                            <label class="block text-xs font-medium text-gray-400 mb-1">Tambah Teks Kajian</label>
                            <div class="flex flex-col gap-3">
                                <input type="text" id="textInput" placeholder="Ketik teks kajian..." class="w-full text-sm bg-gray-900 border border-gray-600 rounded px-3 py-3 focus:outline-none focus:border-blue-500 text-white">
                                <div class="flex gap-2 items-center">
                                    <select id="fontSelect" class="flex-1 text-sm bg-gray-900 border border-gray-600 rounded px-3 py-3 focus:outline-none focus:border-blue-500 text-white cursor-pointer">
                                        <option value="sans-serif">Sans-Serif</option>
                                        <option value="serif">Serif (Formal)</option>
                                        <option value="monospace">Monospace</option>
                                    </select>
                                    <input type="color" id="textColor" value="#ffffff" class="w-12 h-11 rounded cursor-pointer border border-gray-600 bg-gray-900 p-1">
                                    <button id="btnAddText" class="bg-green-600 hover:bg-green-700 text-white px-5 py-3 rounded text-sm font-semibold transition">Tambah</button>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4 border-t border-gray-700 pt-4">
                            <label class="block text-xs font-medium text-gray-400 mb-2">Timer Kajian (Countup)</label>
                            <div class="flex flex-wrap gap-2 items-center">
                                <button id="btnToggleTimer" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-semibold transition flex-1 sm:flex-none"><i class="fa-solid fa-play mr-1"></i> Mulai Timer</button>
                                <button id="btnResetTimer" class="bg-gray-600 hover:bg-gray-700 text-white px-3 py-2 rounded text-sm font-semibold transition"><i class="fa-solid fa-rotate-left"></i></button>
                                <input type="color" id="timerColor" value="#ffffff" class="w-10 h-9 rounded cursor-pointer border border-gray-600 bg-gray-900 p-1 ml-auto">
                            </div>
                            <div class="mt-3">
                                <label class="flex justify-between text-xs font-medium text-gray-400 mb-1"><span>Transparansi Timer</span><span id="lblTimerAlpha" class="text-blue-400 font-bold">100%</span></label>
                                <div class="flex items-center gap-3"><i class="fa-regular fa-eye-slash text-gray-500 text-xs"></i><input type="range" id="timerAlphaInput" min="0.1" max="1.0" step="0.1" value="1.0" class="w-full accent-blue-500 h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer"><i class="fa-regular fa-eye text-gray-500 text-xs"></i></div>
                            </div>
                        </div>

                        <div class="bg-gray-900 rounded border border-gray-700 p-3 overflow-y-auto max-h-64 min-h-[150px] custom-scrollbar" id="overlayList">
                            <p class="text-sm text-gray-500 text-center mt-4" id="emptyOverlayMsg">Belum ada overlay ditambahkan.</p>
                        </div>
                    </div>

                    <div class="panel-card">
                        <h2 class="text-lg font-semibold mb-4 border-b border-gray-600 pb-2"><i class="fa-solid fa-film mr-2"></i>Media Scene (MP4)</h2>
                        <div id="mediaInputsContainer" class="space-y-4"></div>
                    </div>

                    <div class="panel-card pb-10">
                        <h2 class="text-lg font-semibold mb-4 border-b border-gray-600 pb-2"><i class="fa-solid fa-wand-magic-sparkles mr-2"></i>Transisi</h2>
                        <div class="mb-5">
                            <label class="flex justify-between text-sm font-medium text-gray-400 mb-2"><span>Pindah Scene (Fade)</span><span id="lblSceneSpeed" class="text-blue-400 font-bold">Normal</span></label>
                            <div class="flex items-center gap-3"><i class="fa-solid fa-tortoise text-gray-500"></i><input type="range" id="sceneSpeedInput" min="0.005" max="0.15" step="0.005" value="0.05" class="w-full accent-blue-500 h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer"><i class="fa-solid fa-bolt text-gray-500"></i></div>
                        </div>
                        <div>
                            <label class="flex justify-between text-sm font-medium text-gray-400 mb-2"><span>Muncul/Hilang Overlay</span><span id="lblOverlaySpeed" class="text-blue-400 font-bold">Normal</span></label>
                            <div class="flex items-center gap-3"><i class="fa-solid fa-tortoise text-gray-500"></i><input type="range" id="overlaySpeedInput" min="0.01" max="0.3" step="0.01" value="0.1" class="w-full accent-blue-500 h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer"><i class="fa-solid fa-bolt text-gray-500"></i></div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyBNzJkuhAnk0Mwfl5SXzzfWQ48zcSNCulo",
            authDomain: "mini-0bsstreaming.firebaseapp.com",
            databaseURL: "https://mini-0bsstreaming-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "mini-0bsstreaming",
            storageBucket: "mini-0bsstreaming.firebasestorage.app",
            messagingSenderId: "1028240518505",
            appId: "1:1028240518505:web:23ee30697836bf5516a1f8"
        };
        
        const app = initializeApp(firebaseConfig); const db = getDatabase(app);
        window.fbDB = db; window.fbRef = ref; window.fbSet = set; window.fbOnValue = onValue; window.firebaseReady = true;
    </script>

    <script>
        // --- LOGIKA DUAL UI ---
        const body = document.getElementById('body'); const panelContainer = document.getElementById('panelContainer');
        const btnToggleMenu = document.getElementById('btnToggleMenu'); const btnCloseMenu = document.getElementById('btnCloseMenu');
        const btnSwitchModeV16 = document.getElementById('btnSwitchModeV16'); const statusBadgeV16 = document.getElementById('statusBadgeV16');

        function switchMode(mode) {
            localStorage.setItem('obsUiMode', mode);
            if(mode === 'v16') { body.classList.remove('mode-v15'); body.classList.add('mode-v16'); btnSwitchModeV16.style.display = 'flex'; statusBadgeV16.style.display = 'block'; panelContainer.classList.remove('open'); } 
            else { body.classList.remove('mode-v16'); body.classList.add('mode-v15'); btnSwitchModeV16.style.display = 'none'; statusBadgeV16.style.display = 'none'; }
            setTimeout(() => window.dispatchEvent(new Event('resize')), 100);
        }
        switchMode(localStorage.getItem('obsUiMode') || 'v15');

        btnToggleMenu.addEventListener('click', () => { panelContainer.classList.add('open'); btnToggleMenu.style.display = 'none'; });
        btnCloseMenu.addEventListener('click', () => { panelContainer.classList.remove('open'); btnToggleMenu.style.display = 'flex'; });

        // --- DOM Elements ---
        const canvasContainer = document.getElementById('canvasContainer'); const btnFullscreen = document.getElementById('btnFullscreen'); const fullscreenIcon = document.getElementById('fullscreenIcon');
        const video = document.getElementById('videoSource'); const canvas = document.getElementById('outputCanvas'); const ctx = canvas.getContext('2d');
        const camOffPlaceholder = document.getElementById('camOffPlaceholder'); const camPlaceholderText = document.getElementById('camPlaceholderText');
        const loadingDB = document.getElementById('loadingDB'); const rtmpInput = document.getElementById('rtmpInput'); const camZoomInput = document.getElementById('camZoomInput'); const lblCamZoom = document.getElementById('lblCamZoom');
        
        let overlays = []; let dragTarget = null; let dragOffsetX = 0; let dragOffsetY = 0; let isRemoteAction = false; let camZoom = 1.0;
        let stream = null; let liveSocket = null; let liveRecorder = null; let mediaRecorder = null; let isRecording = false;

        localforage.config({ name: 'MiniObsStudio', storeName: 'mediaFiles' });

        // --- FULLSCREEN ---
        btnFullscreen.addEventListener('click', () => {
            const elem = document.documentElement;
            if (!document.fullscreenElement) { if (elem.requestFullscreen) elem.requestFullscreen(); else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen(); } 
            else { if (document.exitFullscreen) document.exitFullscreen(); else if (document.webkitExitFullscreen) document.webkitExitFullscreen(); }
        });
        document.addEventListener('fullscreenchange', updateFullscreenIcon); document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);

        function handleDragStart(e) {
            const coords = getCanvasCoords(e);
            if (timerActive || timerSeconds > 0) { ctx.font = `bold ${timerOverlay.baseSize * timerOverlay.scale}px monospace`; const timerWidth = ctx.measureText(formatTime(timerSeconds)).width; const timerHeight = timerOverlay.baseSize * timerOverlay.scale; if (coords.x >= timerOverlay.x && coords.x <= timerOverlay.x + timerWidth && coords.y >= timerOverlay.y && coords.y <= timerOverlay.y + timerHeight) { dragTarget = timerOverlay; dragOffsetX = coords.x - timerOverlay.x; dragOffsetY = coords.y - timerOverlay.y; if(e.cancelable) e.preventDefault(); return; } }
            for (let i = overlays.length - 1; i >= 0; i--) { const ov = overlays[i]; if (!ov.visible) continue; let currentW, currentH; if (ov.type === 'image') { currentW = ov.w * ov.scale; currentH = ov.h * ov.scale; } else { ctx.font = `bold ${ov.baseSize * ov.scale}px ${ov.font}`; currentW = ctx.measureText(ov.text).width; currentH = ov.baseSize * ov.scale; } if (coords.x >= ov.x && coords.x <= ov.x + currentW && coords.y >= ov.y && coords.y <= ov.y + currentH) { dragTarget = ov; dragOffsetX = coords.x - ov.x; dragOffsetY = coords.y - ov.y; if(e.cancelable) e.preventDefault(); return; } }
        }
        function handleDragMove(e) { if (!dragTarget) return; if(e.cancelable) e.preventDefault(); const coords = getCanvasCoords(e); dragTarget.x = coords.x - dragOffsetX; dragTarget.y = coords.y - dragOffsetY; }
        function handleDragEnd(e) { if (dragTarget) { if(dragTarget.type === 'text') syncOverlaysToFirebase(); else if(dragTarget.type === 'image') saveImagesToIndexedDB(); } dragTarget = null; }
        canvas.addEventListener('mousedown', handleDragStart); canvas.addEventListener('mousemove', handleDragMove); window.addEventListener('mouseup', handleDragEnd); canvas.addEventListener('touchstart', handleDragStart, { passive: false }); canvas.addEventListener('touchmove', handleDragMove, { passive: false }); window.addEventListener('touchend', handleDragEnd);

        window.changeScene = function(scene) { initAudio(); if (currentScene === scene || pendingScene === scene) return; pendingScene = scene; transitionState = 1; document.querySelectorAll('.scene-btn').forEach(btn => btn.classList.remove('active')); document.getElementById('btnScene' + scene.charAt(0).toUpperCase() + scene.slice(1)).classList.add('active'); if (!isRemoteAction) syncSceneToFirebase(scene); };
        function executeSceneChange() { currentScene = pendingScene; if (currentScene === 'live' && !stream) camOffPlaceholder.classList.remove('hidden'); else camOffPlaceholder.classList.add('hidden'); if (stream) stream.getAudioTracks().forEach(track => { track.enabled = (currentScene === 'live'); }); Object.keys(mediaScenes).forEach(key => { const vid = mediaScenes[key]; if (vid.src) { vid.pause(); vid.currentTime = 0; } }); checkPlayback(); }

        function updateStatus(text, colorClass, iconClass) { const html = `<i class="fa-solid ${iconClass} ${colorClass} mr-2 text-[10px]"></i>${text}`; statusBadgeV15.innerHTML = html; statusBadgeV16.innerHTML = html; }
        function updateVuMeter() { if (analyser && dataArray && stream && currentScene === 'live') { analyser.getByteFrequencyData(dataArray); let sum = 0; for(let i = 0; i < dataArray.length; i++) sum += dataArray[i]; let percent = ((sum / dataArray.length) / 128) * 100; if (percent > 100) percent = 100; vuMeterBar.style.width = percent + '%'; } else { vuMeterBar.style.width = '0%'; } }

        const drawScene = (sceneId, isBackground) => {
            let sourceElement = null; let stateAlpha = 0.0;
            if (mediaScenes[sceneId]) { const activeVid = mediaScenes[sceneId]; const playbackSelect = document.getElementById(`${sceneId}Playback`); const state = window.mediaState[sceneId]; if (isBackground) { if (state.visible) state.alpha = Math.min(1.0, state.alpha + state.fadeSpeed); else state.alpha = Math.max(0.0, state.alpha - state.fadeSpeed); stateAlpha = state.alpha; } else { if (state.pip && state.visible) state.pipAlpha = Math.min(1.0, state.pipAlpha + state.fadeSpeed); else state.pipAlpha = Math.max(0.0, state.pipAlpha - state.fadeSpeed); stateAlpha = state.pipAlpha; } if (activeVid.src && !(activeVid.ended && playbackSelect.value === 'once')) sourceElement = activeVid; }
            if (sourceElement && stateAlpha > 0.0) { ctx.globalAlpha = stateAlpha; let drawWidth = canvas.width; let drawHeight = canvas.height; let drawX = 0; let drawY = 0; let isPipMode = false; if (!isBackground && currentScene === 'live') { isPipMode = true; drawWidth = canvas.width * 0.3; drawHeight = canvas.height * 0.3; drawX = canvas.width - drawWidth - 20; drawY = canvas.height - drawHeight - 20; } if (isPipMode) { ctx.lineWidth = 4; ctx.strokeStyle = "white"; ctx.strokeRect(drawX, drawY, drawWidth, drawHeight); } ctx.drawImage(sourceElement, drawX, drawY, drawWidth, drawHeight); ctx.globalAlpha = 1.0; }
        };

        function drawFrame() {
            updateVuMeter(); ctx.fillStyle = "#000000"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            if (currentScene === 'live') { if (stream && !video.paused) { ctx.globalAlpha = 1.0; const vw = video.videoWidth; const vh = video.videoHeight; const cw = canvas.width; const ch = canvas.height; if (vw && vh) { const cropW = vw / camZoom; const cropH = vh / camZoom; const cropX = (vw - cropW) / 2; const cropY = (vh - cropH) / 2; ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cw, ch); } else ctx.drawImage(video, 0, 0, cw, ch); } } else if (mediaScenes[currentScene]) drawScene(currentScene, true);
            if (currentScene === 'live') { Object.keys(mediaScenes).forEach(key => { const state = window.mediaState[key]; if ((state.pip && state.visible) || state.pipAlpha > 0.0) drawScene(key, false); }); }
            if (transitionState > 0) { if (transitionState === 1) { transitionAlpha = Math.min(1.0, transitionAlpha + sceneFadeSpeed); if (transitionAlpha >= 1.0) { executeSceneChange(); transitionState = 2; } } else if (transitionState === 2) { transitionAlpha = Math.max(0.0, transitionAlpha - sceneFadeSpeed); if (transitionAlpha <= 0.0) transitionState = 0; } ctx.fillStyle = `rgba(0, 0, 0, ${transitionAlpha})`; ctx.fillRect(0, 0, canvas.width, canvas.height); }
            overlays.forEach(ov => { if (ov.visible) ov.alpha = Math.min(1.0, ov.alpha + overlayFadeSpeed); else ov.alpha = Math.max(0.0, ov.alpha - overlayFadeSpeed); if (ov.alpha > 0.0) { ctx.globalAlpha = ov.alpha; let currentW, currentH; if (ov.type === 'image') { currentW = ov.w * ov.scale; currentH = ov.h * ov.scale; ctx.drawImage(ov.img, ov.x, ov.y, currentW, currentH); } else if (ov.type === 'text') { const currentSize = ov.baseSize * ov.scale; ctx.font = `bold ${currentSize}px ${ov.font}`; ctx.fillStyle = ov.color; ctx.textBaseline = 'top'; currentW = ctx.measureText(ov.text).width; currentH = currentSize; ctx.shadowColor = "rgba(0,0,0,0.8)"; ctx.shadowBlur = 4; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2; ctx.fillText(ov.text, ov.x, ov.y); ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; } if (ov === dragTarget && ov.visible) { ctx.strokeStyle = "rgba(255, 235, 59, 0.8)"; ctx.lineWidth = 4; ctx.strokeRect(ov.x, ov.y, currentW, currentH); } ctx.globalAlpha = 1.0; } });
            if (timerActive || timerSeconds > 0) { if (timerActive) { const now = Date.now(); const diff = Math.floor((now - lastTimerUpdate) / 1000); if (diff > 0) { timerSeconds += diff; lastTimerUpdate = now; } } const timerText = formatTime(timerSeconds); const currentSize = timerOverlay.baseSize * timerOverlay.scale; ctx.globalAlpha = timerOverlay.alpha; ctx.font = `bold ${currentSize}px monospace`; ctx.fillStyle = timerOverlay.color; ctx.textBaseline = 'top'; const timerWidth = ctx.measureText(timerText).width; const timerHeight = currentSize; ctx.shadowColor = "rgba(0,0,0,0.9)"; ctx.shadowBlur = 4; ctx.shadowOffsetX = 1; ctx.shadowOffsetY = 1; ctx.fillText(timerText, timerOverlay.x, timerOverlay.y); ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; ctx.globalAlpha = 1.0; if (timerOverlay === dragTarget) { ctx.strokeStyle = "rgba(255, 235, 59, 0.8)"; ctx.lineWidth = 4; ctx.strokeRect(timerOverlay.x, timerOverlay.y, timerWidth, timerHeight); } }
            animationFrameId = requestAnimationFrame(drawFrame);
        } drawFrame();

        // --- YOUTUBE LIVE ---
        btnStream.addEventListener('click', () => {
            const rtmpUrl = rtmpInput.value.trim(); if (!rtmpUrl) { alert('Isi dulu URL RTMP dan Stream Key dari YouTube!'); return; }
            initAudio(); updateStatus('Menyambung ke VPS...', 'text-yellow-500', 'fa-spinner fa-spin');
            try { liveSocket = new WebSocket('wss://livestreamingattauhid.duckdns.org'); } catch(e) { alert('Gagal: ' + e.message); updateStatus(stream ? `Kamera Aktif` : 'Standby', stream ? 'text-green-400' : 'text-gray-300', stream ? 'fa-video' : 'fa-circle'); return; }
            liveSocket.onopen = () => {
                updateStatus('ON AIR (LIVE)', 'text-red-500', 'fa-broadcast-tower fa-fade'); btnStream.classList.add('hidden'); btnRecord.classList.add('hidden'); btnStopStream.classList.remove('hidden'); liveSocket.send(rtmpUrl);
                const canvasStream = canvas.captureStream(30); if (mixedAudioDest && mixedAudioDest.stream.getAudioTracks().length > 0) canvasStream.addTrack(mixedAudioDest.stream.getAudioTracks()[0]); else if (stream && stream.getAudioTracks().length > 0) canvasStream.addTrack(stream.getAudioTracks()[0]);
                const options = { mimeType: 'video/webm; codecs=h264' }; try { liveRecorder = new MediaRecorder(canvasStream, options); } catch(e) { liveRecorder = new MediaRecorder(canvasStream); }
                liveRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0 && liveSocket.readyState === WebSocket.OPEN) liveSocket.send(e.data); }; liveRecorder.start(1000); 
            };
            liveSocket.onclose = () => { stopLiveStream(); }; liveSocket.onerror = (err) => { console.error("WS Error:", err); stopLiveStream(); alert('Koneksi terputus! Pastikan VPS menyala.'); };
        });
        function stopLiveStream() { if (liveRecorder && liveRecorder.state !== 'inactive') liveRecorder.stop(); if (liveSocket && liveSocket.readyState === WebSocket.OPEN) liveSocket.close(); liveSocket = null; btnStream.classList.remove('hidden'); btnRecord.classList.remove('hidden'); btnStopStream.classList.add('hidden'); updateStatus(stream ? `Kamera Aktif` : 'Standby', stream ? 'text-green-400' : 'text-gray-300', stream ? 'fa-video' : 'fa-circle'); }
        btnStopStream.addEventListener('click', stopLiveStream);

        // --- REKAM LOKAL ---
        btnRecord.addEventListener('click', () => {
            initAudio(); const canvasStream = canvas.captureStream(30); if (mixedAudioDest && mixedAudioDest.stream.getAudioTracks().length > 0) canvasStream.addTrack(mixedAudioDest.stream.getAudioTracks()[0]); else if (stream && stream.getAudioTracks().length > 0) canvasStream.addTrack(stream.getAudioTracks()[0]);
            const options = { mimeType: 'video/webm; codecs=vp9' }; try { mediaRecorder = new MediaRecorder(canvasStream, options); } catch (e) { mediaRecorder = new MediaRecorder(canvasStream); }
            recordedChunks = []; mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); }; mediaRecorder.onstop = saveRecording; mediaRecorder.start(); isRecording = true;
            btnRecord.classList.add('hidden'); btnStream.classList.add('hidden'); btnStopRecord.classList.remove('hidden'); updateStatus('Merekam...', 'text-red-500', 'fa-circle-dot');
        });
        btnStopRecord.addEventListener('click', () => { if (mediaRecorder && isRecording) { mediaRecorder.stop(); isRecording = false; btnRecord.classList.remove('hidden'); btnStream.classList.remove('hidden'); btnStopRecord.classList.add('hidden'); updateStatus(stream ? `Kamera Aktif (${currentCamWidth}x${currentCamHeight})` : 'Standby', stream ? 'text-green-400' : 'text-gray-300', stream ? 'fa-video' : 'fa-circle'); } });
        function saveRecording() { const blob = new Blob(recordedChunks, { type: 'video/webm' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.style = 'display: none'; a.href = url; a.download = `Kajian_Pro_${currentCamHeight}p_${new Date().getTime()}.webm`; document.body.appendChild(a); a.click(); setTimeout(() => { window.URL.revokeObjectURL(url); document.body.removeChild(a); }, 100); }

        function formatTime(totalSeconds) { const h = Math.floor(totalSeconds / 3600).toString().padStart(2, '0'); const m = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0'); const s = (totalSeconds % 60).toString().padStart(2, '0'); return `${h}:${m}:${s}`; }
        btnToggleTimer.addEventListener('click', () => { timerActive = !timerActive; if (timerActive) { lastTimerUpdate = Date.now(); btnToggleTimer.innerHTML = '<i class="fa-solid fa-pause mr-1"></i> Pause Timer'; btnToggleTimer.classList.replace('bg-blue-600', 'bg-yellow-600'); btnToggleTimer.classList.replace('hover:bg-blue-700', 'hover:bg-yellow-700'); } else { btnToggleTimer.innerHTML = '<i class="fa-solid fa-play mr-1"></i> Mulai Timer'; btnToggleTimer.classList.replace('bg-yellow-600', 'bg-blue-600'); btnToggleTimer.classList.replace('hover:bg-yellow-700', 'hover:bg-blue-700'); } });
        btnResetTimer.addEventListener('click', () => { timerSeconds = 0; if (!timerActive) drawFrame(); });

        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(err => {}); }); }
    </script>
